<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P.E.N. · Planetary Environmental Navigator</title>
<meta name="description" content="Find where on Earth looks, and is lit, like a Moon or Mars site.">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/svg+xml" href="/brand/pen-favicon.svg">
<link rel="apple-touch-icon" href="/brand/pen-icon.svg">
<link rel="preload" href="%BASE_URL%fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="%BASE_URL%fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="%BASE_URL%data/manifest.json" as="fetch" crossorigin>
<script>
try { var t = localStorage.getItem('pen-theme'); if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
